<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>غرفة إدارة الكافل</title>
  <style>
    :root{--bg:#080b10;--panel:#111722;--panel2:#161e2b;--gold:#d4a72c;--gold2:#f0cc62;--text:#f7f3e8;--muted:#9da7b5;--danger:#d84c4c;--ok:#27ae60;--line:#293344}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1c2028 0,#080b10 42%);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}.hidden{display:none!important}
    .login{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(430px,100%);background:rgba(17,23,34,.96);border:1px solid #3a3422;border-radius:22px;padding:34px;box-shadow:0 24px 80px #0009;text-align:center}.emblem{width:86px;height:86px;margin:auto;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-size:40px;background:#0b0f16}.login h1{margin:18px 0 5px;color:var(--gold2)}.login p{margin:0 0 22px;color:var(--muted)}
    label{display:block;text-align:right;color:#d9deea;margin:12px 0 6px}.field{width:100%;border:1px solid var(--line);border-radius:11px;background:#0b1018;color:white;padding:12px;outline:none}.field:focus{border-color:var(--gold)}.primary{border:0;border-radius:11px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#171306;font-weight:bold;padding:12px 18px;cursor:pointer}.login .primary{width:100%;margin-top:18px}.error{color:#ff8585;min-height:22px;margin-top:12px}
    header{height:72px;position:sticky;top:0;z-index:5;background:#0b1018eF;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;backdrop-filter:blur(12px)}header h1{font-size:20px;margin:0;color:var(--gold2)}header small{color:var(--muted)}.logout{background:transparent;color:#ffb3b3;border:1px solid #773b3b;padding:9px 14px;border-radius:9px;cursor:pointer}
    .layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 72px)}aside{border-left:1px solid var(--line);background:#0c1119;padding:18px}.nav-btn{width:100%;text-align:right;background:transparent;color:#cfd5df;border:0;border-radius:10px;padding:12px;margin-bottom:6px;cursor:pointer}.nav-btn:hover,.nav-btn.active{background:#242331;color:var(--gold2);box-shadow:inset -3px 0 var(--gold)}main{padding:25px;max-width:1250px;width:100%;margin:auto}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.topline h2{margin:0}.badge{padding:6px 10px;border-radius:20px;background:#17351f;color:#81e39d;font-size:12px}
    .grid{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:0 10px 30px #0003}.card h3{margin:0 0 15px;color:var(--gold2)}textarea.field{min-height:82px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;align-items:center;gap:9px;margin:15px 0;color:#d7dce5}.actions{display:flex;gap:9px;margin-top:16px}.secondary{border:1px solid var(--line);background:#202938;color:#fff;border-radius:10px;padding:10px 15px;cursor:pointer}
    .items{display:grid;gap:11px}.empty{color:var(--muted);text-align:center;padding:45px 10px}.item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.item h4{margin:0 0 7px}.item p{margin:3px 0;color:var(--muted);font-size:13px;word-break:break-word}.item-buttons{display:flex;gap:6px}.edit,.delete{border:0;border-radius:8px;padding:7px 10px;color:white;cursor:pointer}.edit{background:#315a86}.delete{background:#743535}.toast{position:fixed;left:20px;bottom:20px;padding:13px 18px;border-radius:10px;background:#17351f;border:1px solid #2c7742;color:#b7f4c8;box-shadow:0 10px 40px #0008;z-index:20}
    @media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;border-left:0;border-bottom:1px solid var(--line);padding:10px}.nav-btn{min-width:max-content;margin:0 3px}.grid{grid-template-columns:1fr}main{padding:16px}.row{grid-template-columns:1fr}header{padding:0 14px}}
  </style>
</head>
<body>
  <section id="loginView" class="login">
    <div class="login-card"><div class="emblem">ك</div><h1>غرفة إدارة الكافل</h1><p>الدخول مخصص لإدارة القناة فقط</p>
      <form id="loginForm"><label>البريد الإلكتروني</label><input id="email" class="field" type="email" autocomplete="username" required><label>كلمة السر</label><input id="password" class="field" type="password" autocomplete="current-password" required><button class="primary" type="submit">دخول آمن</button><div id="loginError" class="error"></div></form>
    </div>
  </section>
  <section id="adminView" class="hidden">
    <header><div><h1>غرفة إدارة الكافل</h1><small id="userEmail"></small></div><button id="logoutBtn" class="logout">تسجيل الخروج</button></header>
    <div class="layout"><aside id="nav"></aside><main><div class="topline"><h2 id="sectionTitle"></h2><span class="badge">متصل بقاعدة البيانات</span></div>
      <div class="grid"><form id="itemForm" class="card"><h3 id="formTitle">إضافة محتوى</h3><input id="docId" type="hidden"><label>العنوان</label><input id="title" class="field" required><label>الوصف أو التفاصيل</label><textarea id="description" class="field"></textarea><label>الرابط</label><input id="url" class="field" type="url" placeholder="https://"><label>رابط الصورة</label><input id="imageUrl" class="field" type="url" placeholder="https://"><div class="row"><div><label>التاريخ</label><input id="date" class="field" type="date"></div><div><label>الوقت</label><input id="time" class="field" type="time"></div></div><div class="row"><div><label>الترتيب</label><input id="order" class="field" type="number" value="0"></div><label class="check"><input id="enabled" type="checkbox" checked> ظاهر في التطبيق</label></div><div class="actions"><button class="primary" type="submit">حفظ</button><button id="cancelBtn" class="secondary" type="button">إلغاء التعديل</button></div></form>
      <section class="card"><h3>المحتوى الحالي</h3><div id="items" class="items"><div class="empty">جاري التحميل...</div></div></section></div>
    </main></div>
  </section><div id="toast" class="toast hidden"></div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, setDoc, doc, deleteDoc, onSnapshot, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
    const firebaseConfig={apiKey:"AIzaSyB4Nb3XD7fOYnMBaax8GwMqw_hXs6fHLMs",authDomain:"alkafel-live-tv.firebaseapp.com",projectId:"alkafel-live-tv",storageBucket:"alkafel-live-tv.firebasestorage.app",messagingSenderId:"207636839919",appId:"1:207636839919:web:34fc137a18421e29ac4a1a"};
    const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
    const sections=[['announcements','الإعلانات'],['posters','\u0627\u0644\u0628\u0648\u0633\u062a\u0631\u0627\u062a'],['news_ticker','الشريط الإخباري'],['programs','البرامج'],['majalis','المجالس الحسينية'],['schedule','جدول البث'],['preachers','الخطباء'],['visits','الزيارات'],['labbaik','لبيك يا حسين'],['studio','استديو الكافل'],['app_settings','إعدادات التطبيق']];
    const $=id=>document.getElementById(id); let active='announcements',unsubscribe=null,cache=[];
    function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}
    function resetForm(){$('itemForm').reset();$('docId').value='';$('order').value=0;$('enabled').checked=true;$('formTitle').textContent='إضافة محتوى'}
    function nav(){ $('nav').innerHTML=sections.map(([id,name])=>`<button class="nav-btn ${id===active?'active':''}" data-id="${id}">${name}</button>`).join(''); document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{active=b.dataset.id;resetForm();nav();listen()}); $('sectionTitle').textContent=sections.find(x=>x[0]===active)[1] }
    function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function render(){if(!cache.length){$('items').innerHTML='<div class="empty">لا يوجد محتوى بعد</div>';return}$('items').innerHTML=cache.map(x=>`<article class="item"><div><h4>${esc(x.title||'بدون عنوان')}</h4><p>${esc(x.description||'')}</p><p>${esc(x.date||'')} ${esc(x.time||'')} ${x.enabled===false?'• مخفي':'• ظاهر'}</p></div><div class="item-buttons"><button class="edit" data-id="${x.id}">تعديل</button><button class="delete" data-id="${x.id}">حذف</button></div></article>`).join('');document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>edit(b.dataset.id));document.querySelectorAll('.delete').forEach(b=>b.onclick=()=>remove(b.dataset.id))}
    function listen(){if(unsubscribe)unsubscribe();$('items').innerHTML='<div class="empty">جاري التحميل...</div>';unsubscribe=onSnapshot(query(collection(db,active),orderBy('order','asc')),s=>{cache=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>{$('items').innerHTML=`<div class="error">تعذر القراءة: ${esc(e.message)}</div>`})}
    function edit(id){const x=cache.find(v=>v.id===id);if(!x)return;['title','description','url','imageUrl','date','time','order'].forEach(k=>$(k).value=x[k]??'');$('enabled').checked=x.enabled!==false;$('docId').value=id;$('formTitle').textContent='تعديل المحتوى';scrollTo({top:0,behavior:'smooth'})}
    async function remove(id){if(!confirm('هل تريد حذف هذا المحتوى؟'))return;await deleteDoc(doc(db,active,id));toast('تم الحذف')}
    $('itemForm').onsubmit=async e=>{e.preventDefault();const data={title:$('title').value.trim(),description:$('description').value.trim(),url:$('url').value.trim(),imageUrl:$('imageUrl').value.trim(),date:$('date').value,time:$('time').value,order:Number($('order').value||0),enabled:$('enabled').checked,updatedAt:serverTimestamp()};const id=$('docId').value;if(id)await setDoc(doc(db,active,id),data,{merge:true});else await addDoc(collection(db,active),{...data,createdAt:serverTimestamp()});resetForm();toast('تم الحفظ بنجاح')};
    $('cancelBtn').onclick=resetForm;$('logoutBtn').onclick=()=>signOut(auth);$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(err){$('loginError').textContent='تعذر الدخول: تحقق من البريد وكلمة السر'}};
    onAuthStateChanged(auth,u=>{if(u){$('loginView').classList.add('hidden');$('adminView').classList.remove('hidden');$('userEmail').textContent=u.email;nav();listen()}else{$('adminView').classList.add('hidden');$('loginView').classList.remove('hidden');if(unsubscribe)unsubscribe()}});
  </script>
</body></html>
