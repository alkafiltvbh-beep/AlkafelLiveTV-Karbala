name: Build Karbala APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf "%s" "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/alkafel-release.keystore"
          test -s "$RUNNER_TEMP/alkafel-release.keystore"

      - name: Build Protected Release APK
        env:
          ALKAFEL_KEYSTORE_PATH: ${{ runner.temp }}/alkafel-release.keystore
          ALKAFEL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALKAFEL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ALKAFEL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle clean :app:assembleRelease --stacktrace

      - name: Upload Protected APK
        uses: actions/upload-artifact@v4
        with:
          name: Alkafel-Karbala-Iraq-Protected
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
